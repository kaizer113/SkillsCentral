name: Validate and synchronize skill drafts

on:
  pull_request:
    paths: ['demo/sources/**', 'demo/faqs/**', '.github/workflows/playbook-sync.yml']
  push:
    branches: [main]
    paths: ['demo/sources/**', 'demo/faqs/**', '.github/workflows/playbook-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playbook-draft-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  skills:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [retail-operations, customer-care, agent-lab]
    env:
      IRIS_AGENT_PLAYBOOKS_URL: ${{ vars.IRIS_AGENT_PLAYBOOKS_URL }}
      IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID: ${{ vars.IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID }}
      IRIS_AGENT_PLAYBOOKS_API_KEY: ${{ secrets.IRIS_AGENT_PLAYBOOKS_CONTENT_API_KEY }}
      IRIS_AGENT_PLAYBOOKS_CONTENT_API_KEY: ${{ secrets.IRIS_AGENT_PLAYBOOKS_CONTENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the verified demo CLI version
        run: python -m pip install 'redis-iris==1.0.1'
      - name: Validate local packages without network credentials
        run: >-
          env -u IRIS_AGENT_PLAYBOOKS_URL -u IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID
          -u IRIS_AGENT_PLAYBOOKS_API_KEY -u IRIS_AGENT_PLAYBOOKS_CONTENT_API_KEY
          iris --json --no-input agent-playbooks skills validate "demo/sources/${{ matrix.source }}/skills"
      - name: Preview remote changes
        if: github.event_name != 'pull_request' && env.IRIS_AGENT_PLAYBOOKS_API_KEY != '' && env.IRIS_AGENT_PLAYBOOKS_URL != '' && env.IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID != ''
        run: iris --json --no-input agent-playbooks skills plan "demo/sources/${{ matrix.source }}/skills" --publish none
      - name: Upload changed drafts, preserving the serving publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.IRIS_AGENT_PLAYBOOKS_API_KEY != '' && env.IRIS_AGENT_PLAYBOOKS_URL != '' && env.IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID != ''
        run: iris --json --no-input agent-playbooks skills sync "demo/sources/${{ matrix.source }}/skills" --publish none

  faqs:
    runs-on: ubuntu-latest
    env:
      IRIS_AGENT_PLAYBOOKS_URL: ${{ vars.IRIS_AGENT_PLAYBOOKS_URL }}
      IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID: ${{ vars.IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID }}
      IRIS_AGENT_PLAYBOOKS_API_KEY: ${{ secrets.IRIS_AGENT_PLAYBOOKS_CONTENT_API_KEY }}
      IRIS_AGENT_PLAYBOOKS_CONTENT_API_KEY: ${{ secrets.IRIS_AGENT_PLAYBOOKS_CONTENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'redis-iris==1.0.1'
      - name: Validate local FAQs without network credentials
        run: >-
          env -u IRIS_AGENT_PLAYBOOKS_URL -u IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID
          -u IRIS_AGENT_PLAYBOOKS_API_KEY -u IRIS_AGENT_PLAYBOOKS_CONTENT_API_KEY
          iris --json --no-input agent-playbooks faqs validate demo/faqs
      - name: Preview FAQ changes
        if: github.event_name != 'pull_request' && env.IRIS_AGENT_PLAYBOOKS_API_KEY != '' && env.IRIS_AGENT_PLAYBOOKS_URL != '' && env.IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID != ''
        run: iris --json --no-input agent-playbooks faqs plan demo/faqs --publish none
      - name: Upload FAQ drafts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.IRIS_AGENT_PLAYBOOKS_API_KEY != '' && env.IRIS_AGENT_PLAYBOOKS_URL != '' && env.IRIS_AGENT_PLAYBOOKS_PLAYBOOK_ID != ''
        run: iris --json --no-input agent-playbooks faqs sync demo/faqs --publish none
